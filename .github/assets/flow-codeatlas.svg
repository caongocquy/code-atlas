<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" role="img" aria-labelledby="title desc">
  <title id="title">CodeAtlas intelligence flow</title>
  <desc id="desc">A flow from repository scanning through graph and lexical indexes to coding agents.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#67e8f9"/>
    </marker>
  </defs>
  <rect width="640" height="640" rx="20" fill="url(#panel)"/>
  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif" text-anchor="middle">
    <g fill="none" stroke="#67e8f9" stroke-width="2" marker-end="url(#arrow)">
      <path d="M320 120V154"/><path d="M320 240V274"/><path d="M320 360V394"/><path d="M320 480V514"/>
    </g>
    <g stroke="#475569" stroke-width="1.5">
      <rect x="80" y="40" width="480" height="80" rx="12" fill="#172554"/>
      <rect x="80" y="160" width="480" height="80" rx="12" fill="#172554"/>
      <rect x="80" y="280" width="480" height="80" rx="12" fill="#172554"/>
      <rect x="80" y="400" width="480" height="80" rx="12" fill="#172554"/>
      <rect x="80" y="520" width="480" height="80" rx="12" fill="#172554"/>
    </g>
    <g fill="#f8fafc" font-size="17" font-weight="600">
      <text x="320" y="74">Repository</text><text x="320" y="194">Scanner / parsers</text>
      <text x="320" y="314">Graph + lexical index</text><text x="320" y="434">Core services</text>
      <text x="320" y="554">CLI · MCP · agents</text>
    </g>
    <g fill="#94a3b8" font-size="13">
      <text x="320" y="99">source files</text><text x="320" y="219">symbols and relations</text>
      <text x="320" y="339">indexed evidence</text><text x="320" y="459" font-size="12">search · symbols · callers · imports · impact · trace</text>
      <text x="320" y="579">decisions with context</text>
    </g>
  </g>
</svg>
