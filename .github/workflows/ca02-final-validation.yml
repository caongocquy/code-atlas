name: CA-02 final validation

on:
  pull_request:
    paths:
      - 'test/ca02-final-validation.test.ts'
      - 'test/fixtures/ca02-edge-audit/**'
      - '.github/workflows/ca02-final-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gold-and-parity:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
      - run: corepack enable
      - name: Install pinned dependencies
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if pnpm install --frozen-lockfile; then exit 0; fi
            if [[ "$attempt" -eq 3 ]]; then exit 1; fi
            sleep $((attempt * 10))
          done
      - name: Typecheck
        run: pnpm exec tsc --noEmit
      - name: Prepare native parsers
        run: node scripts/parser-distribution.mjs prepare --build-missing
      - name: Gold precision/recall, parity and CA-02 regression suite
        run: node --import tsx/esm --test test/ca02-final-validation.test.ts test/ca02-repeated-callsite-provenance.test.ts test/ca02-nested-function-identity.test.ts test/ca02-import-alias-resolution.test.ts test/ca02-bare-call-resolution.test.ts
      - name: MCP Inspector public stdio contract
        run: node --import tsx/esm --test test/phase15e-mcp-inspector.test.ts

  windows-gold:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
      - run: corepack enable
      - name: Install pinned dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          pnpm install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Typecheck
        run: pnpm exec tsc --noEmit
      - name: Prepare native parsers
        run: node scripts/parser-distribution.mjs prepare --build-missing
      - name: Windows graph gold and parity
        run: node --import tsx/esm --test test/ca02-final-validation.test.ts
