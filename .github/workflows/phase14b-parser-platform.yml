name: Phase 14B parser platform

on: [push, pull_request]

jobs:
  linux-x64-native-parsers:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: node scripts/parser-distribution.mjs prepare --build-missing
      - run: pnpm run lint
      - run: node --import tsx/esm --test test/phase14b-parser-packaging.test.ts test/phase14b-language-ecmascript.test.ts test/framework-semantic-fail-fast.test.ts test/react-lazy-route-framework.test.ts test/phase15e-mcp-metadata.test.ts test/phase14c-version-domains.test.ts test/phase17d-c-config-integrity.test.ts

  ca01-paths:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.paths.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: paths
        shell: bash
        env:
          EVENT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          base="$EVENT_BASE"
          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            base=d2570bd789095d82442ff332beb36a5ddd998194
          fi
          git diff --name-only "$base" HEAD > "$RUNNER_TEMP/ca01-paths.txt"
          if grep -Eq '^(src/adapters/mcp/|test/ca01-|eval/mcp/|scripts/(ca01-|run-ca01-|compare-ca01-)|docs/ca01-|\.github/workflows/(phase14b-parser-platform|tree-sitter-installation)\.yml$)' "$RUNNER_TEMP/ca01-paths.txt"; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          fi

  ca01-qualification:
    needs: ca01-paths
    if: needs.ca01-paths.outputs.changed == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/tree-sitter-installation.yml
    with:
      assemble_only: true
      ca01: true
