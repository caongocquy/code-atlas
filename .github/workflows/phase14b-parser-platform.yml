name: Phase 14B parser platform

on: [push, pull_request]

jobs:
  linux-x64-native-parsers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm run lint
      - run: node --import tsx/esm --test test/phase14b-parser-packaging.test.ts test/phase14b-language-ecmascript.test.ts test/framework-semantic-fail-fast.test.ts test/react-lazy-route-framework.test.ts test/phase15e-mcp-metadata.test.ts
