name: Windows smoke (pre-1.6)

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  workflow_dispatch:
    inputs:
      run_onnx:
        description: "Run real local MiniLM/ONNX smoke (downloads model)"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: windows-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-smoke:
    name: Build, native smoke and test package
    runs-on: windows-latest
    timeout-minutes: 50

    steps:
      - name: Checkout tested revision
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install pnpm 11
        shell: pwsh
        run: |
          npm install --global pnpm@11.22.0
          if ($LASTEXITCODE -ne 0) { throw "pnpm install failed" }
          node --version
          pnpm --version

      - name: Install dependencies and native parsers
        shell: pwsh
        run: |
          pnpm install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { throw "pnpm install failed" }

      - name: Typecheck, build and lint
        shell: pwsh
        run: |
          pnpm exec tsc --noEmit
          if ($LASTEXITCODE -ne 0) { throw "typecheck failed" }
          pnpm run build
          if ($LASTEXITCODE -ne 0) { throw "build failed" }
          pnpm run lint
          if ($LASTEXITCODE -ne 0) { throw "lint failed" }

      - name: Targeted Windows regression tests
        shell: pwsh
        run: |
          pnpm exec node --import tsx/esm --test --test-concurrency=2 `
            test/index-writer-lock.test.ts `
            test/pre17e-incremental.test.ts `
            test/pre17e-noop-gate.test.ts `
            test/pre17e-p2-remediation.test.ts `
            test/pre17e-framework-lookup.test.ts `
            test/phase14b-parser-packaging.test.ts `
            test/cli-presentation.test.ts
          if ($LASTEXITCODE -ne 0) { throw "Windows targeted regressions failed" }

      - name: Built CLI index/sync/reindex and delta smoke
        shell: pwsh
        run: |
          node test/windows-smoke-ci.mjs
          if ($LASTEXITCODE -ne 0) { throw "Windows CLI smoke failed" }

      - name: MCP Inspector
        shell: pwsh
        run: |
          pnpm run test:mcp:inspector
          if ($LASTEXITCODE -ne 0) { throw "MCP Inspector failed" }

      - name: Real Windows MiniLM + ONNX
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.run_onnx)
        shell: pwsh
        run: |
          node test/windows-smoke-ci.mjs --onnx-only
          if ($LASTEXITCODE -ne 0) { throw "Windows ONNX smoke failed" }

      - name: Pack Windows-testable npm artifact and verify consumer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $bundle = Join-Path $env:RUNNER_TEMP "code-atlas-windows-artifact"
          $consumer = Join-Path $env:RUNNER_TEMP "code-atlas-windows-consumer"
          New-Item -ItemType Directory -Force -Path $bundle, $consumer | Out-Null
          $packed = npm pack --silent --pack-destination $bundle
          if ($LASTEXITCODE -ne 0) { throw "npm pack failed" }
          $packageFile = ($packed | Select-Object -Last 1).Trim()
          if (-not (Test-Path (Join-Path $bundle $packageFile))) { throw "Missing packed tarball" }
          Set-Content -Path (Join-Path $consumer "package.json") -Value '{"name":"windows-smoke-consumer","private":true}'
          npm install --prefix $consumer --no-audit --no-fund (Join-Path $bundle $packageFile)
          if ($LASTEXITCODE -ne 0) { throw "Packed consumer install failed" }
          $installedCli = Join-Path $consumer "node_modules/@showdar2112/code-atlas/dist/cli.js"
          node $installedCli --version
          if ($LASTEXITCODE -ne 0) { throw "Packed consumer CLI failed" }
          @'
          Code Atlas Windows test artifact
          Git commit: ${{ github.sha }}
          Package version: 1.5.0 (testing unreleased develop/PR code; NOT npm latest)
          This is an npm tarball, not a standalone EXE. Requires Node.js >=22 (24 recommended).

          From the folder containing the downloaded .tgz, in PowerShell:
          npm install --prefix "$env:TEMP\code-atlas-test" .\[[TARBALL]]
          & "$env:TEMP\code-atlas-test\node_modules\.bin\code-atlas.cmd" --version

          In your own workspace, test with that absolute .cmd path:
          & "$env:TEMP\code-atlas-test\node_modules\.bin\code-atlas.cmd" sync --diagnostic-timings

          Keep your current config, indexes and uncommitted source safe; back up first.
          Do not publish this tarball as npm latest.
          '@.Replace("[[TARBALL]]", $packageFile) | Set-Content -Path (Join-Path $bundle "INSTALL-WINDOWS.txt")

      - name: Upload Windows test artifact
        uses: actions/upload-artifact@v4
        with:
          name: code-atlas-windows-test-${{ github.sha }}
          path: ${{ runner.temp }}/code-atlas-windows-artifact/
          if-no-files-found: error
          retention-days: 14

      - name: Add Windows smoke summary
        if: always()
        shell: pwsh
        run: |
          "## Code Atlas Windows smoke" >> $env:GITHUB_STEP_SUMMARY
          "" >> $env:GITHUB_STEP_SUMMARY
          "- Revision: $env:GITHUB_SHA" >> $env:GITHUB_STEP_SUMMARY
          "- Job result: ${{ job.status }}" >> $env:GITHUB_STEP_SUMMARY
          "- Full suite intentionally omitted (12 existing canonical failures)." >> $env:GITHUB_STEP_SUMMARY
          "- ONNX executes on develop pushes or opted-in manual dispatch; not on PRs." >> $env:GITHUB_STEP_SUMMARY
          "- Artifact is a test npm tarball, **not an executable** and not a published release." >> $env:GITHUB_STEP_SUMMARY
