name: Windows graph path parity (focused, non-release)

on:
  pull_request:
    paths:
      - 'src/core/graph/build-graph.ts'
      - 'src/core/graph/build-file-updates.ts'
      - 'test/phase0-incremental.test.ts'
      - '.github/workflows/windows-graph-path-parity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  graph-path-parity:
    name: Graph path parity / ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
        node: ['22.23.3', '24.21.0']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: corepack enable
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck production and regression fixtures
        run: pnpm exec tsc --noEmit
      - name: Prepare native parsers
        run: node scripts/parser-distribution.mjs prepare --build-missing
      - name: Focused full vs incremental graph parity
        run: node --import tsx/esm --test test/phase0-incremental.test.ts
      - name: Existing facts graph resolution regressions
        run: node --import tsx/esm --test test/phase14b-facts-graph-resolver.test.ts
