name: CA-02 import alias resolution

on:
  pull_request:
    paths:
      - 'src/core/graph/resolver/**'
      - 'src/core/graph/build-graph.ts'
      - 'src/config/constants.ts'
      - 'test/ca02-import-alias-resolution.test.ts'
      - '.github/workflows/ca02-import-alias-resolution.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  imports-regression:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
      - run: corepack enable
      - name: Install locked dependencies
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if pnpm install --frozen-lockfile; then exit 0; fi
            if [[ "$attempt" -eq 3 ]]; then exit 1; fi
            sleep $((attempt * 10))
          done
      - name: Typecheck
        run: pnpm exec tsc --noEmit
      - name: Prepare parsers
        run: node scripts/parser-distribution.mjs prepare --build-missing
      - name: Import alias and existing call resolution tests
        run: node --import tsx/esm --test test/ca02-import-alias-resolution.test.ts test/ca02-bare-call-resolution.test.ts test/phase14b-resolver-decisions.test.ts test/phase14b-typescript-member-calls.test.ts
